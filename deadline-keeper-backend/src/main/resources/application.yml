spring:
  application:
    name: deadline-keeper-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Supabase
supabase:
  url: ${SUPABASE_URL:https://placeholder.supabase.co}
  jwt-secret: ${SUPABASE_JWT_SECRET:placeholder}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder}

# Google Gemini
gemini:
  api-key: ${GEMINI_API_KEY:placeholder}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# SendGrid
sendgrid:
  api-key: ${SENDGRID_API_KEY:placeholder}
  from-email: ${SENDGRID_FROM_EMAIL:deadlines@example.com}
  inbox-parse-domain: ${SENDGRID_INBOX_PARSE_DOMAIN:deadlines.example.com}

# Google Calendar
google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:placeholder}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:placeholder}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/sync/callback}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# App
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

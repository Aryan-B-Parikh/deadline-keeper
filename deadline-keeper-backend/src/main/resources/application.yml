spring:
  application:
    name: deadline-keeper-backend

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Supabase
supabase:
  url: ${SUPABASE_URL:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  webhook-secret: ${SUPABASE_WEBHOOK_SECRET:}

# Google Gemini
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# SendGrid
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}
  inbox-parse-domain: ${SENDGRID_INBOX_PARSE_DOMAIN:}
  webhook-secret: ${SENDGRID_WEBHOOK_SECRET:}

# Google Calendar
google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/sync/callback}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# App
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
